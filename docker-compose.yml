# Local dev stack — run from the repo root:  docker compose up --build
# (docker/docker-compose.yml is the same stack; use either.)
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-pet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-pet-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  migrate:
    build: .
    container_name: smart-pet-migrate
    command: ["npm", "run", "migrate"]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: smartpet
      PG_USER: postgres
      PG_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    container_name: smart-pet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_MODE: cloud
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: smartpet
      PG_USER: postgres
      PG_PASSWORD: postgres
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-do-not-use-in-production}
      APP_BASE_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ../backoffice-dashboard
    container_name: smart-pet-dashboard
    profiles: ["dashboard"]
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
