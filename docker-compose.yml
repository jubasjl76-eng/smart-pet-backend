services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-pet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-pet-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: .
    container_name: smart-pet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_MODE: cloud
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: smartpet
      PG_USER: postgres
      PG_PASSWORD: postgres
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-do-not-use-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres-data:
