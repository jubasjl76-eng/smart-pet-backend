listener 1883
persistence false
log_dest stdout

# Local dev: anonymous. A laptop, one kennel — not exposed.
allow_anonymous true

# To enforce the per-device ACL the backend generates:
#   1. set MOSQUITTO_ACL_PATH=/mosquitto/config/acl on the backend service
#   2. mount a shared volume for /mosquitto/config
#   3. uncomment below, create a passwd file (mosquitto_passwd), restart
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
