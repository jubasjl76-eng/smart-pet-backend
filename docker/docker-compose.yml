version: '3.8'

services:
  # Cloud Backend (PostgreSQL)
  backend:
    build: .
    container_name: smart-pet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_MODE=cloud
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=smartpet
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-do-not-use-in-production}
      - API_KEY=smart-pet-api-key-2026
    depends_on:
      - postgres
    networks:
      - pet-network

  postgres:
    image: postgres:16-alpine
    container_name: smart-pet-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smartpet
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pet-network

  # Edge Backend (SQLite)
  edge-backend:
    build: .
    container_name: smart-pet-edge
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - BACKEND_MODE=edge
      - CLOUD_BACKEND_URL=http://backend:3000
      - API_KEY=smart-pet-api-key-2026
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-do-not-use-in-production}
    networks:
      - pet-network

networks:
  pet-network:
    driver: bridge

volumes:
  postgres-data:
