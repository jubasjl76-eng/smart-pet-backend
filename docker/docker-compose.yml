# Local dev stack — the whole breeder product on a laptop.
#   docker compose -f docker/docker-compose.yml up --build
#
#   postgres   :5432   Postgres 16
#   mosquitto  :1883   MQTT broker (anonymous — laptop only; ACL model lives in the DB)
#   backend    :3000   API + breeder platform + MQTT engine
#   dashboard  :5173   staff/breeder web console — opt-in (Phase 2):
#                        docker compose --profile dashboard up
#
# Point the simulator at this broker:
#   cd ../smart-pet-simulator && npm run sim -- --scenario feeder-jam --broker mqtt://localhost:1883
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-pet-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartpet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-pet-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: smart-pet-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      BACKEND_MODE: cloud
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: smartpet
      PG_USER: postgres
      PG_PASSWORD: postgres
      MQTT_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-do-not-use-in-production}
      APP_BASE_URL: http://localhost:5173
      # MOSQUITTO_ACL_PATH: /mosquitto/config/acl   # enable to write a real ACL file
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  dashboard:
    build:
      context: ../../backoffice-dashboard
      dockerfile: Dockerfile
    container_name: smart-pet-dashboard
    profiles: ["dashboard"]   # opt-in: `docker compose --profile dashboard up`
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
